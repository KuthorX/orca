name: Sync upstream main

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

concurrency:
  group: upstream-sync-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    if: github.repository == 'KuthorX/orca'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/stablyai/orca.git
          git fetch --prune upstream main

      - name: Merge upstream main
        run: |
          set -euo pipefail
          # ponytail: preserve fork edits on conflicting hunks; review conflict paths in logs when semantic resolution is needed.
          if git merge --no-edit -X ours upstream/main; then
            git diff --check
          else
            conflicts="$(git diff --name-only --diff-filter=U)"
            git merge --abort
            echo "::error::Upstream merge needs semantic conflict resolution:"
            printf '%s\n' "$conflicts"
            exit 1
          fi

      - name: Push merged main
        run: git push origin HEAD:main
